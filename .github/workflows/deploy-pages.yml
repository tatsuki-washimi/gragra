name: Deploy Pages

'on':
  # G3: publish the pushed main commit; retain manual PR #6 preview deployment.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'PR #6 preview commit SHA (manual only)'
        required: true
        default: '92d8c89eea0ab92edecef9b266aa457691c9d9e7'

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate source revision input
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::source_sha must be a complete 40-character commit SHA'
            exit 1
          fi
      - name: Checkout source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
          fetch-depth: 0

      - name: Record and verify target revision
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          RESOLVED_SHA="$(git rev-parse HEAD)"
          if [[ "${SOURCE_SHA,,}" != "$RESOLVED_SHA" ]]; then
            echo '::error::Checked-out revision does not match requested source_sha'
            exit 1
          fi
          # Manual previews stay confined to the reviewed PR #6 commit history.
          # Main push events are authenticated by the push branch trigger.
          if [[ "$RUN_EVENT" == "workflow_dispatch" ]]; then
            git fetch --no-tags origin 'refs/pull/6/head:refs/remotes/origin/pr-6-preview'
            if ! git merge-base --is-ancestor "$RESOLVED_SHA" refs/remotes/origin/pr-6-preview; then
              echo '::error::source_sha is not on the PR #6 history'
              exit 1
            fi
          fi
          echo "Requested source_sha: $SOURCE_SHA"
          echo "Resolved commit SHA:  $RESOLVED_SHA"
          echo "Commit Author:        $(git log -1 --format='%an <%ae>')"
          echo "Commit Date:          $(git log -1 --format='%cd')"
          echo "Commit Subject:       $(git log -1 --format='%s')"
          echo "RESOLVED_SHA=$RESOLVED_SHA" >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,field-io,docs]'

      - name: Build documentation (strict)
        run: |
          python -m mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
