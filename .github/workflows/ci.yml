name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[dev,field-io,docs]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: mkdocs build --strict
  numba-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[dev,field-io,numba]'
      - run: GRAGRA_SPECFEM_BACKEND=numba pytest -q tests/test_specfem_reader.py::test_displacement_acceleration_backend_matches_numpy_when_required
  cpp-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: CMAKE_ARGS=-DGRAGRA_BUILD_CPP=ON pip install '.[dev,field-io,docs]'
      - run: GRAGRA_SPECFEM_BACKEND=cpp pytest -q tests/test_specfem_reader.py::test_displacement_acceleration_backend_matches_numpy_when_required
