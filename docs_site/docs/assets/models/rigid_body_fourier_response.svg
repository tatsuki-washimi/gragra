<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Rigid-Body Kinematics and Fourier Response</title>
  <desc id="desc">Dual-representation pipeline: time-domain body pose (translation c(t), rotation R(t)) and harmonic Fourier series.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Rigid-Body Kinematics and Fourier Response</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Left box: Time-Domain Kinematics -->
  <rect x="50" y="80" width="200" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="150" y="108" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Time-Domain Pose</text>
  <text x="150" y="138" font-family="sans-serif" font-size="13" fill="#475569" text-anchor="middle">Translation c(t)</text>
  <text x="150" y="162" font-family="sans-serif" font-size="13" fill="#475569" text-anchor="middle">Rotation matrix R(t)</text>
  <!-- Mini trajectory -->
  <path d="M80,220 Q120,180 150,230 T220,200" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="255" font-family="sans-serif" font-size="12" fill="#0284c7" text-anchor="middle">x(t) = R(t) x_body + c(t)</text>

  <!-- Center conversion arrow -->
  <line x1="265" y1="175" x2="315" y2="175" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="290" y="165" font-family="sans-serif" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">FFT / Series</text>

  <!-- Right box: Fourier Spectral Domain -->
  <rect x="330" y="80" width="180" height="190" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="420" y="108" font-family="sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Fourier Harmonics</text>
  <!-- Discrete spectral lines -->
  <g stroke="#0284c7" stroke-width="3">
    <line x1="365" y1="230" x2="365" y2="150"/>
    <line x1="400" y1="230" x2="400" y2="130"/>
    <line x1="435" y1="230" x2="435" y2="170"/>
    <line x1="470" y1="230" x2="470" y2="195"/>
  </g>
  <line x1="350" y1="230" x2="490" y2="230" stroke="#64748b" stroke-width="1.5"/>
  <text x="420" y="255" font-family="sans-serif" font-size="12" fill="#0369a1" text-anchor="middle">Harmonics f_k = k f_0</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Rigid coordinates x_world(t) = R(t) x_body + c(t) · Fourier series expansion at harmonics f_k = k f_0</text>
</svg>
