<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Water-Channel Inflow Step Transient</title>
  <desc id="desc">Sudden inflow step disturbance entering an open channel and propagating downstream at wave speed U.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Water-Channel Inflow Step Transient</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Channel longitudinal section -->
  <!-- Channel bed -->
  <line x1="50" y1="230" x2="510" y2="230" stroke="#475569" stroke-width="3"/>
  <text x="50" y="255" font-family="sans-serif" font-size="13" fill="#475569">Channel bed</text>

  <!-- Step water profile -->
  <!-- Base water height h0 from x=270 to 510 -->
  <!-- Step height h0 + Δh from x=50 to 270 -->
  <path d="M50,230 L50,130 L270,130 L270,170 L510,170 L510,230 Z" fill="url(#grad-water)" stroke="#0284c7" stroke-width="2"/>

  <!-- Inflow step front at x = Ut -->
  <line x1="270" y1="110" x2="270" y2="190" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="270" y="100" font-family="sans-serif" font-size="14" font-weight="700" fill="#be123c" text-anchor="middle">Step front (x = Ut)</text>

  <!-- Step height Δh -->
  <line x1="285" y1="130" x2="285" y2="170" stroke="#0f172a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="300" y="155" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Δh</text>

  <!-- Flow propagation velocity arrow -->
  <line x1="220" y1="150" x2="330" y2="150" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="345" y="155" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Speed U</text>

  <!-- Downstream observation point -->
  <circle cx="430" cy="110" r="6" fill="#e11d48"/>
  <text x="445" y="115" font-family="sans-serif" font-size="14" font-weight="700" fill="#be123c">Observer</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Heaviside step in water level Δh Θ(x - Ut) · Transient gravitational acceleration Fourier response</text>
</svg>
