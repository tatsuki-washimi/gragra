<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Waterfall and Uncorrelated Water Surface</title>
  <desc id="desc">Dual water models: vertical waterfall column with area fluctuations and surface grid of incoherent turbulent cells.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Waterfall and Uncorrelated Water Surface</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Left: Vertical Waterfall Model -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="90" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Vertical Waterfall</text>
    <!-- Waterfall column along z -->
    <rect x="75" y="45" width="30" height="130" fill="url(#grad-water)" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="90" y1="45" x2="90" y2="185" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="90" y="200" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">Fluctuating Area δA(z, Ω)</text>
    <!-- Mirror distance D -->
    <circle cx="160" cy="110" r="4" fill="#e11d48"/>
    <text x="160" y="130" font-family="sans-serif" font-size="11" fill="#be123c">Mirror</text>
    <line x1="105" y1="110" x2="160" y2="110" stroke="#e11d48" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="130" y="105" font-family="sans-serif" font-size="11" fill="#be123c">D</text>
  </g>

  <!-- Right: Incoherent Surface Cells -->
  <g transform="translate(290, 60)">
    <rect x="0" y="0" width="210" height="230" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="105" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Incoherent Surface Cells</text>
    <!-- Grid of cells -->
    <g stroke="#0284c7" stroke-width="1" fill="#bae6fd" opacity="0.7">
      <rect x="35" y="55" width="30" height="30"/>
      <rect x="70" y="55" width="30" height="30" fill="#7dd3fc"/>
      <rect x="105" y="55" width="30" height="30"/>
      <rect x="140" y="55" width="30" height="30" fill="#7dd3fc"/>
      <rect x="35" y="90" width="30" height="30" fill="#7dd3fc"/>
      <rect x="70" y="90" width="30" height="30"/>
      <rect x="105" y="90" width="30" height="30" fill="#7dd3fc"/>
      <rect x="140" y="90" width="30" height="30"/>
    </g>
    <text x="105" y="145" font-family="sans-serif" font-size="12" fill="#0369a1" text-anchor="middle">Cell area A_cell, water depth H</text>
    <text x="105" y="170" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Spatially uncorrelated</text>
    <text x="105" y="190" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">ASD_a ∝ G ρ √(A_cell w) H^(-3/2)</text>
  </g>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Waterfall transfer functions T_axA, T_azA to mirror at distance D · Incoherent surface cell area A_cell</text>
</svg>
