<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Uniform-density cylinder geometry</title>
  <desc id="desc">A finite cylinder of radius R and height H, centered at c, with its local z axis shown.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f7b6aa"/>
      <stop offset="0.5" stop-color="#e86b5b"/>
      <stop offset="1" stop-color="#c83d36"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#30343b"/>
    </marker>
    <marker id="red-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a92e2a"/>
    </marker>
  </defs>
  <rect width="560" height="360" rx="18" fill="#fffaf8"/>
  <g stroke="#a92e2a" stroke-width="2">
    <path d="M150 100 C150 78 211 60 286 60 C361 60 422 78 422 100 L422 254 C422 276 361 294 286 294 C211 294 150 276 150 254 Z" fill="url(#body)"/>
    <ellipse cx="286" cy="100" rx="136" ry="40" fill="#f5a89b"/>
    <path d="M150 254 C150 276 211 294 286 294 C361 294 422 276 422 254" fill="none"/>
  </g>
  <ellipse cx="286" cy="100" rx="136" ry="40" fill="none" stroke="#a92e2a" stroke-width="2"/>
  <path d="M286 177 L286 36" stroke="#30343b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="48" font-family="sans-serif" font-size="18" fill="#30343b">z</text>
  <circle cx="286" cy="177" r="5" fill="#24272c"/>
  <text x="298" y="183" font-family="sans-serif" font-size="17" fill="#24272c">center c</text>
  <path d="M286 100 L405 100" stroke="#a92e2a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red-arrow)"/>
  <text x="338" y="91" font-family="sans-serif" font-size="18" fill="#7e211e">R</text>
  <path d="M448 100 L448 254" stroke="#30343b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="460" y="183" font-family="sans-serif" font-size="18" fill="#30343b">H</text>
  <text x="40" y="326" font-family="sans-serif" font-size="17" fill="#30343b">Uniform density ρ · schematic, not to scale</text>
</svg>
