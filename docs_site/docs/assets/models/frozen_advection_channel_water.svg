<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Frozen-Advection Water Channel Noise (Top-Down View)</title>
  <desc id="desc">Top-down view of open water channel of width w with frozen surface elevation eta(x - vt, y) advected past mirror at perpendicular horizontal distance D.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Frozen-Advection Water Channel Noise (Top-Down View)</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Channel band (Top-down view) -->
  <rect x="50" y="80" width="460" height="90" fill="url(#grad-water)" stroke="#0284c7" stroke-width="2"/>
  <text x="60" y="105" font-family="sans-serif" font-size="13" font-weight="700" fill="#0369a1">Water channel (width w)</text>

  <!-- Channel width dimension w -->
  <line x1="490" y1="80" x2="490" y2="170" stroke="#0369a1" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="498" y="130" font-family="sans-serif" font-size="13" font-weight="700" fill="#0369a1">w</text>

  <!-- Flow velocity v vector (along x) -->
  <line x1="160" y1="125" x2="310" y2="125" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="235" y="115" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Flow velocity v</text>
  <text x="235" y="148" font-family="sans-serif" font-size="12" fill="#0369a1" text-anchor="middle">Frozen surface elevation η(x - vt, y)</text>

  <!-- Channel centerline -->
  <line x1="50" y1="125" x2="510" y2="125" stroke="#0284c7" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Mirror / Observation target at perpendicular distance D -->
  <circle cx="280" cy="270" r="7" fill="#e11d48"/>
  <text x="295" y="275" font-family="sans-serif" font-size="15" font-weight="700" fill="#be123c">Mirror target</text>

  <!-- Perpendicular horizontal distance D -->
  <line x1="280" y1="125" x2="280" y2="263" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,4" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="290" y="205" font-family="sans-serif" font-size="14" font-weight="700" fill="#be123c">Perpendicular horizontal distance D</text>

  <!-- Coordinate badge -->
  <rect x="50" y="240" width="160" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="258" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Channel axis: x</text>
  <text x="60" y="275" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Perpendicular axis: y (distance D)</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Top-down view · Flow velocity v along channel · Perpendicular horizontal distance D to mirror</text>
</svg>
