<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Frozen-Advection Water Channel Noise</title>
  <desc id="desc">Open water channel of width W with surface fluctuations advected rigidly at flow speed U (Taylor's hypothesis).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Frozen-Advection Water Channel Noise</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Channel top view / 3D cut -->
  <!-- Water channel bed and surface -->
  <polygon points="60,190 400,190 470,120 130,120" fill="url(#grad-water)" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Channel width W -->
  <line x1="400" y1="190" x2="470" y2="120" stroke="#334155" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="445" y="160" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155">Width W</text>

  <!-- Flow speed vector U (Frozen advection along channel) -->
  <line x1="160" y1="155" x2="310" y2="155" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="235" y="145" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Flow speed U</text>
  <text x="235" y="175" font-family="sans-serif" font-size="12" fill="#0369a1" text-anchor="middle">Frozen surface: η(x - Ut, y)</text>

  <!-- Target mirror detector at position (0, 0, D) -->
  <circle cx="260" cy="270" r="7" fill="#e11d48"/>
  <text x="275" y="275" font-family="sans-serif" font-size="15" font-weight="700" fill="#be123c">Mirror target (0, 0, D)</text>

  <!-- Vertical distance D -->
  <line x1="260" y1="190" x2="260" y2="270" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="245" y="235" font-family="sans-serif" font-size="13" font-weight="600" fill="#be123c" text-anchor="end">Distance D</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Surface elevation η(x - Ut, y) · Target mirror at depth D · Gravitational perturbation phasor & ASD</text>
</svg>
