<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Isotropic Stochastic Rayleigh Acceleration CSD</title>
  <desc id="desc">Isotropic Rayleigh wave field incident from all horizontal azimuths theta yielding a 3x3 diagonal acceleration CSD tensor at a single target depth z.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Isotropic Stochastic Rayleigh Acceleration CSD</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Surface / Azimuthal disk showing all-azimuth incidence -->
  <ellipse cx="200" cy="180" rx="130" ry="75" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="200" y="90" font-family="sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Isotropic incidence θ ∈ [0, 2π)</text>

  <!-- Inward wave arrows converging on single target -->
  <g stroke="#0284c7" stroke-width="1.8">
    <line x1="85" y1="180" x2="145" y2="180" marker-end="url(#arrow-blue)"/>
    <line x1="315" y1="180" x2="255" y2="180" marker-end="url(#arrow-blue)"/>
    <line x1="200" y1="115" x2="200" y2="150" marker-end="url(#arrow-blue)"/>
    <line x1="200" y1="245" x2="200" y2="210" marker-end="url(#arrow-blue)"/>
    <line x1="120" y1="135" x2="160" y2="160" marker-end="url(#arrow-blue)"/>
    <line x1="280" y1="225" x2="240" y2="200" marker-end="url(#arrow-blue)"/>
    <line x1="120" y1="225" x2="160" y2="200" marker-end="url(#arrow-blue)"/>
    <line x1="280" y1="135" x2="240" y2="160" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Single target sensor at depth z -->
  <circle cx="200" cy="180" r="7" fill="#e11d48"/>
  <text x="200" y="170" font-family="sans-serif" font-size="14" font-weight="700" fill="#be123c" text-anchor="middle">Target (depth z)</text>

  <!-- 3x3 Diagonal CSD tensor card (right) -->
  <rect x="360" y="90" width="170" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="445" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Single-Target CSD Tensor</text>
  <text x="445" y="145" font-family="sans-serif" font-size="13" font-weight="600" fill="#0369a1" text-anchor="middle">S_a(f, z) = A²(z) S_ξ(f)</text>

  <!-- Matrix brackets & diagonal elements -->
  <text x="390" y="180" font-family="monospace" font-size="15" fill="#334155">[ 1/2   0    0  ]</text>
  <text x="390" y="205" font-family="monospace" font-size="15" fill="#334155">[  0   1/2   0  ]</text>
  <text x="390" y="230" font-family="monospace" font-size="15" fill="#334155">[  0    0    1  ]</text>
  <text x="445" y="258" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Shape: (M, 3, 3) per frequency</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Single-target CSD tensor · Isotropic horizontal components (1/2, 1/2) · Vertical component (1)</text>
</svg>
