<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Isotropic Stochastic Rayleigh Wave Field</title>
  <desc id="desc">Superposition of uncorrelated Rayleigh waves incident uniformly from all horizontal azimuths θ on a free surface.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Isotropic Stochastic Rayleigh Wave Field</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Surface circle showing all-azimuth incidence -->
  <circle cx="280" cy="180" r="100" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>

  <!-- Converging multi-directional wave arrows (isotropic) -->
  <g stroke="#0284c7" stroke-width="2">
    <line x1="150" y1="180" x2="210" y2="180" marker-end="url(#arrow-blue)"/>
    <line x1="410" y1="180" x2="350" y2="180" marker-end="url(#arrow-blue)"/>
    <line x1="280" y1="50" x2="280" y2="110" marker-end="url(#arrow-blue)"/>
    <line x1="280" y1="310" x2="280" y2="250" marker-end="url(#arrow-blue)"/>
    <line x1="188" y1="88" x2="230" y2="130" marker-end="url(#arrow-blue)"/>
    <line x1="372" y1="272" x2="330" y2="230" marker-end="url(#arrow-blue)"/>
    <line x1="188" y1="272" x2="230" y2="230" marker-end="url(#arrow-blue)"/>
    <line x1="372" y1="88" x2="330" y2="130" marker-end="url(#arrow-blue)"/>
  </g>
  <text x="280" y="40" font-family="sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Isotropic random incidence θ ∈ [0, 2π)</text>

  <!-- Two detector targets separated by baseline r -->
  <circle cx="250" cy="180" r="6" fill="#e11d48"/>
  <text x="245" y="170" font-family="sans-serif" font-size="12" font-weight="700" fill="#be123c" text-anchor="end">x_1</text>

  <circle cx="310" cy="180" r="6" fill="#e11d48"/>
  <text x="315" y="170" font-family="sans-serif" font-size="12" font-weight="700" fill="#be123c">x_2</text>

  <!-- Baseline r -->
  <line x1="250" y1="195" x2="310" y2="195" stroke="#e11d48" stroke-width="1.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="280" y="215" font-family="sans-serif" font-size="13" font-weight="700" fill="#be123c" text-anchor="middle">r</text>

  <!-- Bessel correlation formula badge -->
  <rect x="180" y="255" width="200" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="280" y="275" font-family="sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">CSD ∝ J_0(k_R r) ASD_a(f)</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Free surface z = 0 · Isotropic angular distribution · Cross-spectral density CSD governed by J_0(k_R r)</text>
</svg>
