<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Isobaric Atmospheric Temperature Perturbation</title>
  <desc id="desc">Thermal plume / localized temperature fluctuation under constant pressure creating buoyant density perturbation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Isobaric Atmospheric Temperature Perturbation</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Background atmosphere -->
  <rect x="50" y="65" width="460" height="235" fill="url(#grad-sky)" opacity="0.5"/>

  <!-- Warm temperature parcel (Gaussian blob / plume) -->
  <ellipse cx="230" cy="180" rx="95" ry="65" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <ellipse cx="230" cy="180" rx="60" ry="40" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
  <circle cx="230" cy="180" r="4" fill="#be123c"/>

  <text x="230" y="175" font-family="sans-serif" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">Warm parcel: δT &gt; 0</text>
  <text x="230" y="195" font-family="sans-serif" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">Density drop: δρ = - ρ_0 (δT / T_0) &lt; 0</text>

  <!-- Ground line -->
  <line x1="50" y1="300" x2="510" y2="300" stroke="#334155" stroke-width="2"/>
  <text x="70" y="290" font-family="sans-serif" font-size="13" fill="#334155">Ground surface z = 0</text>

  <!-- Target sensor x -->
  <circle cx="440" cy="260" r="6" fill="#0284c7"/>
  <text x="450" y="265" font-family="sans-serif" font-size="15" font-weight="700" fill="#0369a1">target x</text>
  <line x1="230" y1="180" x2="440" y2="260" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="360" y="215" font-family="sans-serif" font-size="13" fill="#0284c7">r = |x - x_T|</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Ideal-gas isobaric relation: δρ / ρ_0 = - δT / T_0 · Thermal parcel coupling to gravitational field</text>
</svg>
