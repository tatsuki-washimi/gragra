<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Causal Point Force Elastodynamic Waves</title>
  <desc id="desc">Expanding spherical P-wave and S-wave fronts generated by a causal point force F(t) in an elastic medium.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Causal Point Force Elastodynamic Waves</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Source location x_0 -->
  <circle cx="210" cy="180" r="6" fill="#e11d48"/>
  <text x="180" y="165" font-family="sans-serif" font-size="14" font-weight="700" fill="#be123c">Source x_0</text>

  <!-- Force vector F(t) -->
  <line x1="210" y1="180" x2="280" y2="180" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="245" y="170" font-family="sans-serif" font-size="14" font-weight="700" fill="#e11d48">F(t)</text>

  <!-- Expanding wavefronts centered at x_0 -->
  <!-- S wave front: radius = 65 -->
  <circle cx="210" cy="180" r="65" fill="#fecdd3" fill-opacity="0.3" stroke="#e11d48" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="255" y="240" font-family="sans-serif" font-size="13" font-weight="700" fill="#be123c">S wave front (r = v_S t)</text>

  <!-- P wave front: radius = 120 -->
  <circle cx="210" cy="180" r="120" fill="#e0f2fe" fill-opacity="0.25" stroke="#0284c7" stroke-width="2"/>
  <text x="305" y="290" font-family="sans-serif" font-size="13" font-weight="700" fill="#0369a1">P wave front (r = v_P t)</text>

  <!-- Observation target x -->
  <circle cx="440" cy="110" r="5" fill="#0284c7"/>
  <text x="450" y="114" font-family="sans-serif" font-size="15" font-weight="700" fill="#0369a1">target x</text>
  <line x1="210" y1="180" x2="440" y2="110" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="340" y="140" font-family="sans-serif" font-size="13" fill="#475569">distance r</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Compressional speed v_P · Shear speed v_S (v_P &gt; v_S) · Near-field and far-field gravitational response</text>
</svg>
