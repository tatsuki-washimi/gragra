<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Atmospheric Acoustic Halfspace Gravity Noise</title>
  <desc id="desc">Acoustic plane waves propagating in atmospheric halfspace z &gt; 0 creating pressure and density perturbations above ground.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Atmospheric Acoustic Halfspace Gravity Noise</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Atmosphere z > 0 -->
  <rect x="40" y="65" width="480" height="150" fill="url(#grad-sky)"/>
  <text x="60" y="95" font-family="sans-serif" font-size="14" font-weight="700" fill="#0369a1">Atmosphere z &gt; 0 (sound speed c_s)</text>

  <!-- Acoustic wavefronts -->
  <g stroke="#0284c7" stroke-width="2" stroke-dasharray="8,6" opacity="0.8">
    <line x1="120" y1="65" x2="220" y2="215"/>
    <line x1="180" y1="65" x2="280" y2="215"/>
    <line x1="240" y1="65" x2="340" y2="215"/>
    <line x1="300" y1="65" x2="400" y2="215"/>
  </g>
  <!-- Wave propagation vector k -->
  <line x1="180" y1="120" x2="250" y2="150" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="260" y="155" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Acoustic wave vector k</text>
  <text x="210" y="105" font-family="sans-serif" font-size="13" fill="#0369a1">δρ(x, t) = δp / c_s²</text>

  <!-- Ground surface z = 0 -->
  <rect x="40" y="215" width="480" height="85" fill="url(#grad-earth)"/>
  <line x1="40" y1="215" x2="520" y2="215" stroke="#334155" stroke-width="2.5"/>
  <text x="60" y="245" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">Rigid Ground Boundary z = 0</text>

  <!-- Target detector on ground -->
  <circle cx="380" cy="215" r="6" fill="#e11d48"/>
  <text x="395" y="235" font-family="sans-serif" font-size="14" font-weight="700" fill="#be123c">Detector (Mirror)</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Ground surface z = 0 · Atmospheric density perturbation δρ = δp / c_s² · Gravitational attraction at ground sensor</text>
</svg>
