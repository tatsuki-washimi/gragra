<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Prescribed Point-Mass Kinematics</title>
  <desc id="desc">Discrete point masses m_i moving with individual velocities v_i from initial positions x_{0,i}.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#d97706"/>
    </marker>
    <linearGradient id="grad-cuboid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="grad-sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="grad-earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Card background for universal dark/light theme contrast -->
  <rect width="560" height="360" rx="16" fill="#fffaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Prescribed Point-Mass Kinematics</text>
  <text x="536" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="end">Schematic · not to scale</text>

  <!-- Graphic Body -->
  <!-- Point mass cloud at initial epoch t0 -->
  <g fill="#475569">
    <circle cx="140" cy="120" r="7"/>
    <text x="122" y="115" font-family="sans-serif" font-size="13" font-weight="600">m_1</text>
    <circle cx="170" cy="180" r="9"/>
    <text x="150" y="202" font-family="sans-serif" font-size="13" font-weight="600">m_2</text>
    <circle cx="210" cy="110" r="6"/>
    <text x="215" y="105" font-family="sans-serif" font-size="13" font-weight="600">m_3</text>
    <circle cx="120" cy="220" r="8"/>
    <text x="100" y="235" font-family="sans-serif" font-size="13" font-weight="600">m_4</text>
  </g>
  <text x="150" y="75" font-family="sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Initial positions x_{0,i}</text>

  <!-- Individual velocity vectors v_i -->
  <g stroke="#0284c7" stroke-width="2.5">
    <line x1="140" y1="120" x2="250" y2="105" marker-end="url(#arrow-blue)"/>
    <line x1="170" y1="180" x2="280" y2="160" marker-end="url(#arrow-blue)"/>
    <line x1="210" y1="110" x2="310" y2="95" marker-end="url(#arrow-blue)"/>
    <line x1="120" y1="220" x2="225" y2="195" marker-end="url(#arrow-blue)"/>
  </g>
  <text x="210" y="145" font-family="sans-serif" font-size="14" font-weight="700" fill="#0284c7">Velocities v_i</text>
  <text x="210" y="165" font-family="sans-serif" font-size="12" fill="#0369a1">x_i(t) = x_{0,i} + v_i(t - t_0)</text>

  <!-- Displaced cloud at time t -->
  <g fill="#0284c7" opacity="0.8">
    <circle cx="250" cy="105" r="7"/>
    <circle cx="280" cy="160" r="9"/>
    <circle cx="310" cy="95" r="6"/>
    <circle cx="225" cy="195" r="8"/>
  </g>

  <!-- Target sensor x -->
  <circle cx="470" cy="180" r="6" fill="#e11d48"/>
  <text x="480" y="185" font-family="sans-serif" font-size="15" font-weight="700" fill="#be123c">target x</text>
  <!-- Field lines to target -->
  <line x1="280" y1="160" x2="470" y2="180" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="350" y="210" font-family="sans-serif" font-size="13" font-weight="600" fill="#be123c">a(x, t) = -G ∑ m_i Δr_i / r_i³</text>


  <!-- Footer note -->
  <text x="24" y="338" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Point masses m_i · Initial positions x_{0,i} · Individual velocities v_i · Target x</text>
</svg>
