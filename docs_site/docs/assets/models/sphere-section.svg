<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" role="img" aria-labelledby="title desc"><title id="title">Uniform sphere radial section</title><desc id="desc">A cross-section distinguishing the interior r less than R and exterior r greater than R; gradient uses the exterior expression exactly at r equals R.</desc><rect width="540" height="330" fill="none"/><circle cx="216" cy="165" r="113" fill="#b8d4ef" fill-opacity=".8" stroke="#396ea1" stroke-width="2"/><path d="M65 165H492" stroke="#718096" stroke-width="2"/><circle cx="216" cy="165" r="5" fill="#1e456b"/><path d="M216 165H329" stroke="#31658e" stroke-width="4"/><circle cx="271" cy="165" r="6" fill="#2a795d"/><circle cx="409" cy="165" r="6" fill="#b97132"/><text x="238" y="148" font-family="sans-serif" font-size="18" fill="#234e45">r &lt; R</text><text x="359" y="148" font-family="sans-serif" font-size="18" fill="#7d4f20">r &gt; R</text><text x="289" y="189" font-family="sans-serif" font-size="18" fill="#1e456b">R</text><text x="190" y="184" font-family="sans-serif" font-size="18" fill="#1e456b">c</text><text x="44" y="27" font-family="sans-serif" font-size="15" fill="#4d5966">Interior / exterior cross-section</text><text x="28" y="306" font-family="sans-serif" font-size="15" fill="#4d5966">At r = R, the current API selects the exterior gradient formula.</text></svg>